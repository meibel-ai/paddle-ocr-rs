[package]
name = "pdf-extractor-2-md"
version = "0.1.0"
edition = "2021"
authors = ["Dario Finardi"]
description = "PDF/immagine → Markdown: ispezione profonda dei PDF nativi via pdfium, OCR PP-OCRv6 con fallback Tesseract per le scansioni"
license = "Apache-2.0"
# Il folder contiene anche il materiale di riferimento e gli asset runtime:
# non devono finire in un eventuale `cargo package`.
exclude = ["old_project/", "models/", "native/", "support/", "test/", "tools/", "benchmark/"]

# Questo repo ospita anche i progetti storici in old_project/ (ognuno col suo
# workspace): la tabella vuota chiude qui il workspace del nuovo crate.
[workspace]

[dependencies]
anyhow = "1"
# Solo per la detection veloce pagina-per-pagina (Fase 1): scan dei content
# stream grezzi senza caricare tutti gli oggetti. Il testo lo estrae pdfium.
# Versione unica in tutto l'albero (chk_defaced inclusa): niente doppio lopdf.
lopdf = "0.44"
# Ramo nativo (Fase 2+): binding dinamico a native/<arch>/pdfium.dll.
pdfium-render = "0.8"
# Immagini estratte dalle pagine (Fase 2) e, più avanti, i raster del ramo OCR.
# La versione deve restare quella di pdfium-render (feature `image_025`),
# altrimenti i DynamicImage che restituisce non sono i nostri.
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
# Integrità documento (font defacing + testo nascosto/prompt injection),
# crate dell'autore. Path-dep sul vendored: condivide il NOSTRO lopdf 0.44.
# default-features = false: niente CLI (clap), niente HTML (scraper), niente
# webview/wasm — resta la sola scansione deterministica.
chk_defaced = { path = "support/chk_defaced", default-features = false }

[[bin]]
name = "pdf2md"
path = "src/bin/pdf2md.rs"
