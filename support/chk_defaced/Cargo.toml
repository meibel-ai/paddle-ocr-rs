[package]
edition = "2021"
name = "chk_defaced"
version = "0.2.4"
authors = ["Dario Finardi <df@dariofinardi.it>"]
build = false
autolib = false
autobins = false
autoexamples = false
autotests = false
autobenches = false
description = "Detect 'defaced' documents: verify the coherence of the fonts used to render text (PDF, DOCX, HTML+CSS) and build a JSON index of the system fonts' cmaps."
readme = "README.md"
keywords = [
    "pdf",
    "docx",
    "font",
    "security",
    "ocr",
]
categories = [
    "text-processing",
    "command-line-utilities",
]
license = "AGPL-3.0-only"
